---
# defaults file for ansible-plexmediaserver

plex_install_plugins: false
plex_install_hama: false
plex_install_abs: false
plex_add_package_repos: true
plex_package_manager_downgrade_security: false # Plex-packages seem to lag-behaind on proper SHA-signing whcih makes RHEL cranky
plex_perform_system_wide_upgrade: true # Will upgrade all packages, not just Plex. Can break stuff.
#plex_username: Not plemented, designed to run incontainers for now
abs_url: "https://raw.githubusercontent.com/ZeroQI/Absolute-Series-Scanner/master/Scanners/Series/Absolute%20Series%20Scanner.py"

plexmediaserver:
  directories:
    main: "/var/lib/plexmediaserver/Library/Application Support/Plex Media Server/"
  packages:
    downgrade_security: "{{ plex_package_manager_downgrade_security }}"
    rpm_repository:
      name: "plex"
      baseurl: "https://downloads.plex.tv/repo/rpm/$basearch/"
      # enabled: True
      description: "Plex RPM repository (stored using Ansible)"
      gpgkey: "https://downloads.plex.tv/plex-keys/PlexSign.key"
      gpgcheck: yes
    apt_repository:
      name: "Not implemented"
    names:
      core:
        - "plexmediaserver"
        - "python3-pip" # For plugins
      abs:
      - libxslt
      - python3-libxslt  #TODO: python-bindings migth br obsolete
  service:
    name: "plexmediaserver"
